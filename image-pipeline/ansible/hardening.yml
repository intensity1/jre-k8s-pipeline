---
# Entry point playbook for the golden-image hardening step.
# Run by Packer's ansible provisioner against a freshly-booted, unhardened
# base VM (Proxmox clone or AWS EBS builder instance). Both Packer templates
# in this repo point at this same file — the hardening steps are identical
# regardless of which cloud/hypervisor the image will run on.

- name: Harden base image and install security agent
  hosts: default
  become: true
  vars:
    # Overridden per-build by Packer's extra_arguments / ansible_env_vars
    # if you want build-time metadata baked into motd/files. Not required
    # for the hardening itself.
    image_build_date: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H%M') }}"

  roles:
    - baseline-hardening
    - security-agent

  post_tasks:
    - name: Record build metadata for audit trail
      ansible.builtin.copy:
        dest: /etc/image-build-info
        mode: "0644"
        content: |
          image_build_date={{ image_build_date }}
          hardening_playbook_version={{ lookup('env', 'GITHUB_SHA') | default('local-build', true) }}
