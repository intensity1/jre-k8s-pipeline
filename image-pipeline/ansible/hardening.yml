---
# Entry point playbook for the golden-image hardening step.
# Run by Packer's ansible provisioner against a freshly-booted, unhardened
# base VM (Proxmox clone or AWS EBS builder instance). Both Packer templates
# in this repo point at this same file — the hardening steps are identical
# regardless of which cloud/hypervisor the image will run on.

- name: Harden base image and install security agent
  hosts: default
  become: true
  # Disabled here and re-enabled explicitly as the second pre_task below.
  # Ansible's automatic fact-gathering is normally the very first thing
  # that runs in a play — before pre_tasks — which meant it was racing
  # cloud-init's growpart/resizefs and hitting the pre-resize disk size.
  gather_facts: false
  vars:
    # Overridden per-build by Packer's extra_arguments / ansible_env_vars
    # if you want build-time metadata baked into motd/files. Not required
    # for the hardening itself.
    image_build_date: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H%M') }}"

  pre_tasks:
    # SSH becoming reachable doesn't mean cloud-init (growpart/resizefs
    # included) has actually finished — confirmed by direct inspection
    # during image-pipeline development. This used to be a standalone
    # Packer "shell" provisioner, but Packer's own native file-upload
    # mechanism proved unreliable against this VM (hung indefinitely
    # uploading even a trivial script, unrelated to cloud-init itself —
    # see docs/packer-explained.md). Ansible's own connection path proved
    # reliable throughout, so the wait now runs through it instead.
    #
    # Uses `raw`, not `command`/`shell`, deliberately: normal Ansible
    # modules stage themselves into a remote temp directory before
    # running, which itself can fail with "No space left on device" if
    # growpart hasn't freed up room yet — the exact chicken-and-egg this
    # task exists to avoid. `raw` executes directly over the SSH
    # connection with no staging at all.
    #
    # Polls with short, separate checks (until/retries/delay) rather than
    # a single blocking `cloud-init status --wait` call — confirmed that
    # approach can die mid-wait ("Shared connection ... closed", with
    # --wait's own progress dots cut off in the output) when held open
    # too long through the ansible proxy adapter. Each retry here is a
    # quick, independent command instead of one long-lived blocked
    # connection. "not in" checks for the word "running" rather than
    # requiring an exact "done", since Proxmox's built-in cloud-init
    # integration uses an old deprecated config syntax to inject Packer's
    # ephemeral SSH key (nothing in this repo's own config), which makes
    # cloud-init report "degraded done" rather than a clean "done" even on
    # a fully successful run — confirmed via `cloud-init status --long`.
    - name: Wait for cloud-init to finish
      ansible.builtin.raw: cloud-init status
      register: cloud_init_check
      until: "'status: running' not in cloud_init_check.stdout"
      retries: 60
      delay: 5
      changed_when: false
      # `until` only controls when to stop retrying (based on content);
      # it does NOT stop the raw module from separately failing the task
      # over a non-zero exit code once that happens. rc 2 ("degraded
      # done") is expected and fine here — see the comment above — so it
      # must not fail the task on its own.
      failed_when: false

    # cloud-init reporting "done" turned out NOT to reliably mean growpart
    # has actually finished growing the root filesystem on this image —
    # confirmed directly: a follow-up task still hit "No space left on
    # device" immediately after the wait above succeeded, and a 2-minute
    # poll for free space (tried next) never once saw it materialize
    # either. Rather than keep waiting on cloud-init's own automatic
    # growpart/resizefs — whatever is wrong with its timing here, or
    # whether it's running at all — just do the resize ourselves,
    # directly and idempotently. growpart/resize2fs are pre-installed on
    # Ubuntu's cloud images (cloud-init depends on them for this exact
    # purpose) and are both safe to run even if already at full size —
    # growpart reports NOCHANGE, resize2fs is a no-op.
    - name: Ensure the root partition and filesystem actually use the full disk
      ansible.builtin.raw: |
        echo '=== lsblk before ==='
        lsblk
        echo '=== growpart ==='
        growpart -v /dev/sda 1 2>&1
        echo '=== resize2fs ==='
        resize2fs /dev/sda1 2>&1
        echo '=== lsblk after ==='
        lsblk
        echo '=== df -h after ==='
        df -h /
      register: resize_result
      changed_when: false
      failed_when: false

    # Registered raw output isn't printed anywhere by default — surface it
    # explicitly so we can actually see what growpart/resize2fs reported,
    # instead of just a pass/fail status that tells us nothing.
    - name: Show disk-resize diagnostic output
      ansible.builtin.debug:
        var: resize_result.stdout_lines

    - name: Now that the disk actually has room, gather facts
      ansible.builtin.setup:

  roles:
    - baseline-hardening
    - security-agent

  post_tasks:
    - name: Record build metadata for audit trail
      ansible.builtin.copy:
        dest: /etc/image-build-info
        mode: "0644"
        content: |
          image_build_date={{ image_build_date }}
          hardening_playbook_version={{ lookup('env', 'GITHUB_SHA') | default('local-build', true) }}
