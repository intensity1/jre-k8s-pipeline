---
# Baseline hardening role. Deliberately generalized to well-known CIS-style
# controls that apply to any Debian/Ubuntu-family base image. Extend this
# with your own org's specific baseline as needed.

- name: Update all packages to latest
  ansible.builtin.apt:
    upgrade: dist
    update_cache: true
    cache_valid_time: 3600

- name: Remove packages not needed on a hardened server image
  ansible.builtin.apt:
    name:
      - telnet
      - rsh-client
      - talk
    state: absent

- name: Enforce SSH key-based auth only
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - { regexp: "^#?PasswordAuthentication", line: "PasswordAuthentication no" }
    - { regexp: "^#?PermitRootLogin", line: "PermitRootLogin no" }
    - { regexp: "^#?X11Forwarding", line: "X11Forwarding no" }
  notify: restart sshd

- name: Install and enable a baseline firewall (ufw)
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Set default ufw policy - deny incoming, allow outgoing
  community.general.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - { direction: incoming, policy: deny }
    - { direction: outgoing, policy: allow }

- name: Allow SSH through ufw
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Enable ufw
  community.general.ufw:
    state: enabled

- name: Enable unattended security upgrades going forward
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

- name: Enable automatic security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: Set a sane auditd baseline (log auth + sudo use)
  ansible.builtin.apt:
    name: auditd
    state: present
