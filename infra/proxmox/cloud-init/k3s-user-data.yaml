#cloud-config
# Cloud-init snippet that installs single-node k3s on first boot.
#
# Upload this to a Proxmox storage that supports "snippets" (e.g. local),
# then reference it from main.tf's initialization.user_data_file_id.
#
# WHY k3s bootstrap is a cloud-init snippet and not baked into the golden
# image itself: keeping the Kubernetes runtime install as a first-boot step
# (rather than baked into the Packer image) means the SAME hardened base
# image can be reused for non-Kubernetes VMs too, if you ever want that.
# This is a reasonable, debatable choice — baking k3s directly into the
# image via the Ansible hardening playbook instead is equally valid and
# arguably simpler for a single-purpose homelab. Documented here as a
# decision point, not a hard rule.

runcmd:
  - curl -sfL https://get.k3s.io | sh -
  # A fixed `sleep 10` was here originally, racing against however long k3s
  # actually takes to generate its kubeconfig on first start (cert
  # generation, etc. — not bounded by a constant). Poll for the real file
  # instead of guessing a duration.
  - |
    for i in $(seq 1 30); do
      [ -f /etc/rancher/k3s/k3s.yaml ] && break
      sleep 2
    done
  - cp /etc/rancher/k3s/k3s.yaml /home/ubuntu/k3s.yaml
  - chown ubuntu:ubuntu /home/ubuntu/k3s.yaml
  # The whole value MUST be quoted here: an unquoted ':' followed by a
  # space, anywhere in a YAML plain scalar, is parsed as a mapping
  # key/value separator — not literal text. Without these quotes, YAML
  # silently turns this single string into a dict at the "with: scp" split,
  # which crashes cc_runcmd's shellify() and aborts the ENTIRE runcmd
  # module (all commands are written as one script in one pass) — so
  # nothing above this line ran either. Confirmed via
  # `sudo cloud-init schema --system` and /var/log/cloud-init.log.
  - 'echo "k3s installed. Fetch kubeconfig with: scp ubuntu@<vm-ip>:k3s.yaml ./kubeconfig-proxmox.yaml"'
