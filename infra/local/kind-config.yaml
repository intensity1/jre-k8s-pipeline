kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: homelab-pipeline
nodes:
  - role: control-plane
    extraPortMappings:
      # Expose the sample app's NodePort (see infra/local/main.tf, service_type)
      # on localhost so you can curl it without any extra tooling.
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
